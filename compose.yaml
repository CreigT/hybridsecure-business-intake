services:
  business-intake:
    build: .
    ports:
      - "8000:8000"
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:?Set OLLAMA_BASE_URL}
      OLLAMA_MODEL: ${OLLAMA_MODEL:?Set OLLAMA_MODEL}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-120}
      BUSINESS_INTAKE_AUDIT_LOG: /app/logs/business_intake_audit.jsonl
      BUSINESS_INTAKE_RATE_LIMIT: ${BUSINESS_INTAKE_RATE_LIMIT:-5}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      FIREBASE_API_KEY: ${FIREBASE_API_KEY:?Set FIREBASE_API_KEY}
      FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN:?Set FIREBASE_AUTH_DOMAIN}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?Set FIREBASE_PROJECT_ID}
      FIREBASE_STORAGE_BUCKET: ${FIREBASE_STORAGE_BUCKET:-}
      FIREBASE_MESSAGING_SENDER_ID: ${FIREBASE_MESSAGING_SENDER_ID:-}
      FIREBASE_APP_ID: ${FIREBASE_APP_ID:?Set FIREBASE_APP_ID}
      FIREBASE_AUTHORIZED_DOMAINS: ${FIREBASE_AUTHORIZED_DOMAINS:-localhost}
      FIREBASE_VERIFICATION_RESEND_SECONDS: ${FIREBASE_VERIFICATION_RESEND_SECONDS:-60}
      INTAKE_VERIFICATION_TICKET_SECONDS: ${INTAKE_VERIFICATION_TICKET_SECONDS:-1800}
      INTAKE_VERIFICATION_SIGNING_KEY: ${INTAKE_VERIFICATION_SIGNING_KEY:?Set INTAKE_VERIFICATION_SIGNING_KEY}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-admin.json
    volumes:
      - intake-audit:/app/logs
      - ${FIREBASE_ADMIN_CREDENTIALS_FILE:?Set FIREBASE_ADMIN_CREDENTIALS_FILE}:/run/secrets/firebase-admin.json:ro
    restart: unless-stopped

volumes:
  intake-audit:
